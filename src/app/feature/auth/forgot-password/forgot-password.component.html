<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row justify-content-center w-100">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex p-3 mb-3">
                            <i class="bi bi-key-fill fs-1 text-primary"></i>
                        </div>
                        <h2 class="h3 fw-semibold text-dark mb-2">Recuperar contraseña</h2>
                        <p class="text-secondary small mb-0">Ingresa tu correo electrónico y te enviaremos un enlace</p>
                    </div>

                    <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show rounded-3"
                        role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        {{ errorMessage }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show rounded-3"
                        role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        {{ successMessage }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form [formGroup]="forgotForm" (ngSubmit)="submitForgot()">

                        <div class="mb-4">
                            <label for="email" class="form-label fw-semibold text-secondary small text-uppercase mb-2">
                                <i class="bi bi-envelope me-1"></i> Correo electrónico
                            </label>
                            <input type="email" class="form-control form-control-lg rounded-3 border-0 bg-light"
                                id="email" formControlName="email" placeholder="tu@email.com"
                                [class.is-invalid]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
                            <div class="invalid-feedback small mt-1">
                                <i class="bi bi-info-circle me-1"></i>
                                Ingresa un correo electrónico válido
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-semibold py-3 shadow-sm"
                                [disabled]="loading || forgotForm.invalid">
                                <div *ngIf="loading" class="d-flex align-items-center justify-content-center gap-2">
                                    <span class="spinner-border spinner-border-sm" role="status"
                                        aria-hidden="true"></span>
                                    <span>Enviando...</span>
                                </div>
                                <div *ngIf="!loading">
                                    <i class="bi bi-send me-2"></i>
                                    Enviar enlace
                                </div>
                            </button>
                        </div>

                    </form>

                    <div class="position-relative my-4">
                        <hr class="text-secondary opacity-25">
                        <span
                            class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-secondary">
                            ¿Recordaste tu contraseña?
                        </span>
                    </div>

                    <div class="text-center">
                        <button type="button" class="btn btn-outline-secondary rounded-3 fw-semibold px-4 py-2"
                            (click)="goToLogin()">
                            <i class="bi bi-box-arrow-in-left me-2"></i>
                            Volver al inicio de sesión
                        </button>
                    </div>

                </div>
            </div>

            <div class="text-center mt-4">
                <small class="text-secondary opacity-50">
                    © 2026 - Cursos Holguín
                </small>
            </div>

        </div>
    </div>
</div>
