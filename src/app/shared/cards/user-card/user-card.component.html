<div class="card border-0 shadow-sm rounded-4 h-100 hover-card text-center">
    <div class="bg-primary bg-opacity-10 text-center py-4 rounded-top-4">
        <div class="bg-primary bg-opacity-25 rounded-circle d-inline-flex p-3">
            <span class="fs-2 fw-semibold text-primary">{{ getInitials() }}</span>
        </div>
    </div>

    <div class="card-body p-4 d-flex flex-column">
        <h5 class="card-title fw-semibold text-dark mb-1">
            {{ userItem.firstName }} {{ userItem.lastName }}
        </h5>

        <p class="text-secondary small mb-2">
            <i class="bi bi-envelope me-1"></i>
            {{ userItem.email }}
        </p>

        <div class="mb-3">
            <span class="badge rounded-pill text-light px-3 py-2" [ngClass]="{
                'bg-primary bg-opacity-10 text-primary': userItem.role === 'COURSE_SUPPLIER',
                'bg-success bg-opacity-10 text-success': userItem.role === 'USER',
                'bg-danger bg-opacity-10 text-danger': userItem.role === 'ADMIN'
            }">
                <i class="bi bi-person-badge text-light me-1"></i>
                {{ userItem.role === 'COURSE_SUPPLIER' ? 'Profesor' : 
                   userItem.role === 'ADMIN' ? 'Administrador' : 'Estudiante' }}
            </span>
        </div>

        <p class="text-secondary small mb-3 mt-auto">
            <i class="bi bi-calendar me-1"></i>
            Miembro desde {{ userItem.createdAt | date: 'MMM yyyy' }}
        </p>

<div class="d-flex gap-2">
            <button class="btn btn-outline-primary rounded-3 flex-grow-1"
                (click)="onView()">
                <i class="bi bi-person me-1"></i>
                Ver perfil
            </button>
        </div>
    </div>
</div>
